<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анализ применимости метрик для оценки архитектур микросервисных систем</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #45a049;
        }
        .back-button {
            background-color: #f44336;
        }
        .back-button:hover {
            background-color: #d32f2f;
        }
        .image-container {
            margin: 20px 0;
        }
        img {
            max-width: 100%;
            height: auto;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 4px;
        }
        .progress-bar {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        .progress-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 10px;
            cursor: pointer;
        }
        .step-number {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 5px;
        }
        .step-number.active {
            background-color: #4CAF50;
            color: white;
        }
        .step-name {
            font-size: 12px;
        }
        .metrics-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>Анализ применимости метрик для оценки архитектур микросервисных систем</h1>

    <div id="main-menu">
        <button onclick="showGraphics()">Графики</button>
        <button onclick="showC4Model()">C4-model</button>
        <div class="metrics-buttons">
            <button onclick="showModularity()">Q - индекс модулярности</button>
            <button onclick="showCycles()">Cy(G) - количество циклов</button>
            <button onclick="showInOut()">Сa(S) входящие Ce(S) исходящие зависимости</button>
            <button onclick="showDepth()">D - глубина</button>
            <button onclick="showCentralisation()">Cc - централизованность</button>
        </div>
    </div>

    <!-- Раздел "Графики" -->
    <div id="graphics-section" style="display: none;">
        <h2>Графики</h2>
        <div class="image-container">
            <img src="graph1.png" alt="График 1">
            <img src="graph2.png" alt="График 2">
        </div>
        <button class="back-button" onclick="backToMainMenu()">Назад</button>
    </div>

    <!-- Раздел "C4-model" -->
    <div id="c4-model-section" style="display: none;">
        <h2>C4-model</h2>
        <div class="progress-bar">
            <div class="progress-step" onclick="showC4Context()">
                <div id="step1" class="step-number active">1</div>
                <div class="step-name">Контекст</div>
            </div>
            <div class="progress-step" onclick="showC4Container()">
                <div id="step2" class="step-number">2</div>
                <div class="step-name">Контейнеры</div>
            </div>
            <div class="progress-step" onclick="showC4Component()">
                <div id="step3" class="step-number">3</div>
                <div class="step-name">Компоненты</div>
            </div>
            <div class="progress-step" onclick="showC4Code()">
                <div id="step4" class="step-number">4</div>
                <div class="step-name">Код</div>
            </div>
        </div>

        <div id="c4-context" class="image-container">
            <img src="context.png" alt="Контекстная диаграмма">
            <div>
                <button onclick="showC4Container()">Далее</button>
            </div>
        </div>

        <div id="c4-container" class="image-container" style="display: none;">
            <img src="container.png" alt="Контейнерная диаграмма">
            <div>
                <button onclick="showC4Context()">Назад</button>
                <button onclick="showC4Component()">Далее</button>
            </div>
        </div>

        <div id="c4-component" class="image-container" style="display: none;">
            <img src="component.png" alt="Компонентная диаграмма">
            <div>
                <button onclick="showC4Container()">Назад</button>
                <button onclick="showC4Code()">Далее</button>
            </div>
        </div>

        <div id="c4-code" class="image-container" style="display: none;">
            <img src="code.png" alt="Код">
            <div>
                <button onclick="showC4Component()">Назад</button>
            </div>
        </div>

        <button class="back-button" onclick="backToMainMenu()">Назад в меню</button>
    </div>

    <!-- Раздел "Q - индекс модулярности" -->
    <div id="modularity-section" style="display: none;">
        <h2>Q - индекс модулярности</h2>
        <div class="image-container">
            <img src="Modularity.png" alt="Q - индекс модулярности">
        </div>
        <button class="back-button" onclick="backToMainMenu()">Назад</button>
    </div>

    <!-- Раздел "Cy(G) - количество циклов" -->
    <div id="cycles-section" style="display: none;">
        <h2>Cy(G) - количество циклов</h2>
        <div class="image-container">
            <img src="cycle.png" alt="Количество циклов">
        </div>
        <div>
            <button onclick="showCycleSolution()">Решение</button>
        </div>
        <div id="cycle-solution" class="image-container" style="display: none;">
            <img src="cyclesolution.png" alt="Решение для циклов">
        </div>
        <button class="back-button" onclick="backToMainMenu()">Назад</button>
    </div>

    <!-- Раздел "Сa(S) входящие Ce(S) исходящие зависимости" -->
    <div id="inout-section" style="display: none;">
        <h2>Сa(S) входящие Ce(S) исходящие зависимости</h2>
        <div class="image-container">
            <img src="inout.png" alt="Входящие и исходящие зависимости">
        </div>
        <div>
            <button onclick="showInOutSolution()">Решение</button>
        </div>
        <div id="inout-solution" class="image-container" style="display: none;">
            <img src="inoutsolution.png" alt="Решение для зависимостей">
        </div>
        <button class="back-button" onclick="backToMainMenu()">Назад</button>
    </div>

    <!-- Раздел "D - глубина" -->
    <div id="depth-section" style="display: none;">
        <h2>D - глубина</h2>
        <div class="image-container">
            <img src="depht.png" alt="Глубина">
        </div>
        <div>
            <button onclick="showDepthSolution()">Решение</button>
        </div>
        <div id="depth-solution" class="image-container" style="display: none;">
            <img src="depthsolution.png" alt="Решение для глубины">
        </div>
        <button class="back-button" onclick="backToMainMenu()">Назад</button>
    </div>

    <!-- Раздел "Cc - централизованность" -->
    <div id="centralisation-section" style="display: none;">
        <h2>Cc - централизованность</h2>
        <div class="image-container">
            <img src="centralisation.png" alt="Централизованность">
        </div>
        <button class="back-button" onclick="backToMainMenu()">Назад</button>
    </div>

    <script>
        // Функции для переключения между разделами
        function showGraphics() {
            hideAllSections();
            document.getElementById("graphics-section").style.display = "block";
        }

        function showC4Model() {
            hideAllSections();
            document.getElementById("c4-model-section").style.display = "block";
            showC4Context();
        }

        function showModularity() {
            hideAllSections();
            document.getElementById("modularity-section").style.display = "block";
        }

        function showCycles() {
            hideAllSections();
            document.getElementById("cycles-section").style.display = "block";
        }

        function showCycleSolution() {
            const solutionDiv = document.getElementById("cycle-solution");
            solutionDiv.style.display = solutionDiv.style.display === "none" ? "block" : "none";
        }

        function showInOut() {
            hideAllSections();
            document.getElementById("inout-section").style.display = "block";
        }

        function showInOutSolution() {
            const solutionDiv = document.getElementById("inout-solution");
            solutionDiv.style.display = solutionDiv.style.display === "none" ? "block" : "none";
        }

        function showDepth() {
            hideAllSections();
            document.getElementById("depth-section").style.display = "block";
        }

        function showDepthSolution() {
            const solutionDiv = document.getElementById("depth-solution");
            solutionDiv.style.display = solutionDiv.style.display === "none" ? "block" : "none";
        }

        function showCentralisation() {
            hideAllSections();
            document.getElementById("centralisation-section").style.display = "block";
        }

        // Функции для C4-model
        function updateProgressBar(step) {
            for (let i = 1; i <= 4; i++) {
                const stepElement = document.getElementById(`step${i}`);
                if (i === step) {
                    stepElement.classList.add("active");
                } else {
                    stepElement.classList.remove("active");
                }
            }
        }

        function showC4Context() {
            document.getElementById("c4-context").style.display = "block";
            document.getElementById("c4-container").style.display = "none";
            document.getElementById("c4-component").style.display = "none";
            document.getElementById("c4-code").style.display = "none";
            updateProgressBar(1);
        }

        function showC4Container() {
            document.getElementById("c4-context").style.display = "none";
            document.getElementById("c4-container").style.display = "block";
            document.getElementById("c4-component").style.display = "none";
            document.getElementById("c4-code").style.display = "none";
            updateProgressBar(2);
        }

        function showC4Component() {
            document.getElementById("c4-context").style.display = "none";
            document.getElementById("c4-container").style.display = "none";
            document.getElementById("c4-component").style.display = "block";
            document.getElementById("c4-code").style.display = "none";
            updateProgressBar(3);
        }

        function showC4Code() {
            document.getElementById("c4-context").style.display = "none";
            document.getElementById("c4-container").style.display = "none";
            document.getElementById("c4-component").style.display = "none";
            document.getElementById("c4-code").style.display = "block";
            updateProgressBar(4);
        }

        function backToMainMenu() {
            hideAllSections();
            document.getElementById("main-menu").style.display = "block";
        }

        function hideAllSections() {
            const sections = document.querySelectorAll('div[id$="-section"]');
            sections.forEach(section => {
                section.style.display = "none";
            });
            document.getElementById("main-menu").style.display = "none";
        }
    </script>
</body>
</html>
